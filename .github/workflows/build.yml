name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    # The Sims 4 embeds Python 3.7, so the package is built inside the
    # matching interpreter to produce compatible .pyc bytecode.
    container: python:3.7-slim

    steps:
      - uses: actions/checkout@v4

      - name: Compile-check all mod sources (py3.7 syntax gate)
        run: python -m compileall -q src

      - name: Unit tests (pure-Python economy logic)
        run: python -m unittest discover -s tests -v

      - name: Build .ts4script package
        run: python tools/build_ts4script.py

      - name: Verify archive contents
        run: |
          python - <<'EOF'
          import zipfile
          names = zipfile.ZipFile('build/CommunityPoke_FuneralMod.ts4script').namelist()
          required = {
              'funeral_mod/__init__.pyc',
              'funeral_mod/interactions.pyc',
              'funeral_mod/startup.pyc',
          }
          missing = required - set(names)
          assert not missing, 'missing compiled modules: {}'.format(missing)
          print('archive OK: {} entries'.format(len(names)))
          EOF

      - name: Upload .ts4script artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommunityPoke_FuneralMod.ts4script
          path: build/CommunityPoke_FuneralMod.ts4script
          if-no-files-found: error

  # The same suite on macOS: macos-13 is the x64 image, the only hosted
  # macOS runner where actions/setup-python still ships Python 3.7
  # (3.7.17 darwin-x64), matching the game's embedded interpreter.
  test-macos:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Compile-check all mod sources (py3.7 syntax gate)
        run: python -m compileall -q src

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build .ts4script package
        run: python tools/build_ts4script.py

  # Publish the packaged mod to GitHub Releases whenever a v* tag lands.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CommunityPoke_FuneralMod.ts4script
          path: build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/CommunityPoke_FuneralMod.ts4script
          generate_release_notes: true
